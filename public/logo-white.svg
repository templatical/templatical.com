<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Templatical">
  <title>Templatical</title>
  <mask id="tpl-rules" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect x="0" y="0" width="32" height="32" fill="#fff"/>
      <rect x="6" y="9" width="10" height="1.8" rx="0.9" fill="#000" opacity="0.9"/>
      <rect x="6" y="13.5" width="7" height="1.5" rx="0.75" fill="#000" opacity="0.6"/>
      <rect x="6" y="17" width="9" height="1.5" rx="0.75" fill="#000" opacity="0.6"/>
      <rect x="6" y="20.5" width="5" height="1.5" rx="0.75" fill="#000" opacity="0.4"/>
    </mask>
    <g mask="url(#tpl-rules)">
      <rect x="10" y="1" width="18" height="22" rx="3" fill="#fff" opacity=".35" transform="rotate(8 19 12)"/>
      <rect x="6" y="2" width="18" height="22" rx="3" fill="#fff" opacity=".55" transform="rotate(-4 15 13)"/>
      <rect x="2" y="4" width="18" height="22" rx="3" fill="#fff"/>
